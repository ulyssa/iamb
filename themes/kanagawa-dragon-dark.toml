# kanagawa-dragon-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#0D0C0C)
# COLOR_BG2 => Alternate background (#181616)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#0D0C0C)
#
# COLOR_UI1 => Window border color, completion menu background (#C8C093)
# COLOR_UI2 => Window title color (#737C73)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#C4746E)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#625E5A)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#C4B28A)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#8A9A7B)
#
# COLOR_TEXT1 => Primary text color (#C5C9C5)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#8992A7)
# COLOR_TEXT3 => Alternate text color (#A292A3)
# COLOR_TEXT4 => Alternate text color (#9E9B93)
# COLOR_TEXT5 => Alternate text color (#949FB5)
#
# COLOR_PLUS => Extra colors used for user names: #8BA4B0 #FF9E3B
[theme.users]
colors = [
    "#C4746E",
    "#625E5A",
    "#C4B28A",
    "#8A9A7B",
    "#8992A7",
    "#A292A3",
    "#9E9B93",
    "#949FB5",
    "#8BA4B0",
    "#FF9E3B",
]

[theme.default]
color = "#C5C9C5"
background = "#0D0C0C"

[theme.completion]
default.background = "#0D0C0C"
default.color = "#C8C093"
selected.background = "#181616"
selected.color = "#C5C9C5"

[theme.timeline]
redacted.color = "#625E5A"

[theme.messages]
code.color = "#8992A7"
code.background = "#181616"
emphasis.color = "#9E9B93"
strong.color = "#A292A3"

[theme.rooms]
default.color = "#949FB5"
labels.color = "#9E9B93"
unread.name.color = "#8992A7"
unread.number.color = "#9E9B93"
mention.number.color = "#C4746E"
notification.number.color = "#C4B28A"
marked_unread.number.color = "#8A9A7B"

[theme.windows]
border.color = "#C8C093"
title.color = "#737C73"

[theme.encryption]
icon_encrypted.color = "#8A9A7B"
icon_unencrypted.color = "#C4746E"
icon_unknown.color = "#C4B28A"

[theme.cmdbar]
error.color = "#C4746E"
