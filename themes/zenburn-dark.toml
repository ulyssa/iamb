# zenburn-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#383838)
# COLOR_BG2 => Alternate background (#3F3F3F)
# COLOR_BG3 => Completion menu selected item background (#606060)
#
# COLOR_UI1 => Window border color, text completion menu (#000000)
# COLOR_UI2 => Window title color (#93E0E3)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#DC8CC3)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#DCA3A3)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#F0DFAF)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#AFD8AF)
#
# COLOR_TEXT1 => Primary text color (#DCDCCC)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#CC9393)
# COLOR_TEXT3 => Alternate text color (#7CB8BB)
# COLOR_TEXT4 => Alternate text color (#5F7F5F)
# COLOR_TEXT5 => Alternate text color (#DFAF8F)
#
#
[theme.users]
colors = [
    "#DC8CC3",
    "#DCA3A3",
    "#F0DFAF",
    "#AFD8AF",
    "#CC9393",
    "#7CB8BB",
    "#5F7F5F",
    "#DFAF8F",
]

[theme.default]
color = "#DCDCCC"
background = "#383838"

[theme.completion]
default.background = "#606060"
default.color = "#000000"
selected.background = "#3F3F3F"
selected.color = "#DCDCCC"

[theme.timeline]
redacted.color = "#DCA3A3"

[theme.messages]
code.color = "#CC9393"
code.background = "#3F3F3F"
emphasis.color = "#5F7F5F"
strong.color = "#7CB8BB"

[theme.rooms]
default.color = "#DFAF8F"
labels.color = "#5F7F5F"
unread.name.color = "#CC9393"
unread.number.color = "#5F7F5F"
mention.number.color = "#DC8CC3"
notification.number.color = "#F0DFAF"
marked_unread.number.color = "#AFD8AF"

[theme.windows]
border.color = "#000000"
title.color = "#93E0E3"

[theme.encryption]
icon_encrypted.color = "#AFD8AF"
icon_unencrypted.color = "#DC8CC3"
icon_unknown.color = "#F0DFAF"

[theme.cmdbar]
error.color = "#DC8CC3"
