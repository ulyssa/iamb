# iamb-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#201127)
# COLOR_BG2 => Alternate background (#201433)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#1B1E34)
#
# COLOR_UI1 => Window border color, completion menu background (#F5C9B1)
# COLOR_UI2 => Window title color (#B1DDF5)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#A73169)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#C24B6E)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#FFEB99)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#6AAF9D)
#
# COLOR_TEXT1 => Primary text color (#E8E7E9)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#EC9A6D)
# COLOR_TEXT3 => Alternate text color (#D9626B)
# COLOR_TEXT4 => Alternate text color (#94C5AC)
# COLOR_TEXT5 => Alternate text color (#D0CFD1)
[theme.users]
colors = "rainbow-light"

[theme.default]
color = "#E8E7E9"
background = "#201127"

[theme.completion]
default.background = "#1B1E34"
default.color = "#F5C9B1"
selected.background = "#201433"
selected.color = "#E8E7E9"

[theme.timeline]
redacted.color = "#C24B6E"

[theme.messages]
code.color = "#EC9A6D"
code.background = "#201433"
emphasis.color = "#94C5AC"
strong.color = "#D9626B"

[theme.rooms]
default.color = "#D0CFD1"
labels.color = "#94C5AC"
unread.name.color = "#EC9A6D"
unread.number.color = "#94C5AC"
mention.number.color = "#A73169"
notification.number.color = "#FFEB99"
marked_unread.number.color = "#6AAF9D"

[theme.windows]
border.color = "#F5C9B1"
title.color = "#B1DDF5"

[theme.encryption]
icon_encrypted.color = "#6AAF9D"
icon_unencrypted.color = "#A73169"
icon_unknown.color = "#FFEB99"

[theme.cmdbar]
error.color = "#A73169"
