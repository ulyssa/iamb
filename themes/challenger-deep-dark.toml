# challenger_deep-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#100E23)
# COLOR_BG2 => Alternate background (#1E1C31)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#100E23)
#
# COLOR_UI1 => Window border color, completion menu background (#63F2F1)
# COLOR_UI2 => Window title color (#C991E1)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#FF8080)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#CBE3E7)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#FFE9AA)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#767676)
#
# COLOR_TEXT1 => Primary text color (#AAFFE4)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#FFB378)
# COLOR_TEXT3 => Alternate text color (#91DDFF)
# COLOR_TEXT4 => Alternate text color (#AAFFE4)
# COLOR_TEXT5 => Alternate text color (#AAFFE4)
#
#
[theme.users]
colors = [
    "#FF8080",
    "#CBE3E7",
    "#FFE9AA",
    "#767676",
    "#FFB378",
    "#91DDFF",
    "#AAFFE4",
    "#AAFFE4",
]

[theme.default]
color = "#AAFFE4"
background = "#100E23"

[theme.completion]
default.background = "#100E23"
default.color = "#63F2F1"
selected.background = "#1E1C31"
selected.color = "#AAFFE4"

[theme.timeline]
redacted.color = "#CBE3E7"

[theme.messages]
code.color = "#FFB378"
code.background = "#1E1C31"
emphasis.color = "#AAFFE4"
strong.color = "#91DDFF"

[theme.rooms]
default.color = "#AAFFE4"
labels.color = "#AAFFE4"
unread.name.color = "#FFB378"
unread.number.color = "#AAFFE4"
mention.number.color = "#FF8080"
notification.number.color = "#FFE9AA"
marked_unread.number.color = "#767676"

[theme.windows]
border.color = "#63F2F1"
title.color = "#C991E1"

[theme.encryption]
icon_encrypted.color = "#767676"
icon_unencrypted.color = "#FF8080"
icon_unknown.color = "#FFE9AA"

[theme.cmdbar]
error.color = "#FF8080"
