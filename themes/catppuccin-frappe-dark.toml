[theme.default]
color = "#F4B8E4"
background = "#292C3C"

[theme.completion]
default.background = "#3B3F52"
default.color = "#51576D"
selected.background = "#303446"
selected.color = "#F4B8E4"

[theme.timeline]
redacted.color = "#EEBEBE"

[theme.messages]
code.color = "#BABBF1"
code.background = "#303446"
emphasis.color = "#8CAAEE"
strong.color = "#CA9EE6"

[theme.rooms]
default.color = "#949CBB"
unread.color = "#BABBF1"
labels.color = "#8CAAEE"

[theme.windows]
border.color = "#51576D"
title.color = "#C6D0F5"

[theme.encryption]
icon_encrypted.color = "#A6D189"
icon_unencrypted.color = "#EF9F76"
icon_unknown.color = "#99D1DB"

[theme.cmdbar]
error.color = "#EF9F76"
