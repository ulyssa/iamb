# jellybeans-muted-light-light theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.

#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#F7F3EB)
# COLOR_BG2 => Alternate background (#EBE7DF)
# COLOR_BG3 => Completion menu selected item background (#47463F)
#
# COLOR_UI1 => Window border color, text completion menu (#475B68)
# COLOR_UI2 => Window title color (#222120)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#8C594A)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#787775)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#A28853)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#6D7F59)
#
# COLOR_TEXT1 => Primary text color (#0F0E0D)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#2D2C2A)
# COLOR_TEXT3 => Alternate text color (#334A84)
# COLOR_TEXT4 => Alternate text color (#3C5971)
# COLOR_TEXT5 => Alternate text color (#655683)
#
# COLOR_PLUS => Extra user colors used for users: "#5C5650"
[theme.users]
colors = [
    "#8C594A",
    "#787775",
    "#A28853",
    "#6D7F59",
    "#2D2C2A",
    "#334A84",
    "#3C5971",
    "#655683",
    "#5C5650"
]

[theme.default]
color = "#0F0E0D"
background = "#F7F3EB"

[theme.completion]
default.background = "#47463F"
default.color = "#475B68"
selected.background = "#EBE7DF"
selected.color = "#0F0E0D"

[theme.timeline]
redacted.color = "#787775"

[theme.messages]
code.color = "#2D2C2A"
code.background = "#EBE7DF"
emphasis.color = "#3C5971"
strong.color = "#334A84"

[theme.rooms]
default.color = "#655683"
unread.color = "#2D2C2A"
labels.color = "#3C5971"

[theme.windows]
border.color = "#475B68"
title.color = "#222120"

[theme.encryption]
icon_encrypted.color = "#6D7F59"
icon_unencrypted.color = "#8C594A"
icon_unknown.color = "#A28853"

[theme.cmdbar]
error.color = "#8C594A"
