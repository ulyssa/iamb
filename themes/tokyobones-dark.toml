# tokyobones-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.

#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#1A1B26)
# COLOR_BG2 => Alternate background (#222330)
# COLOR_BG3 => Completion menu selected item background (#303142)
#
# COLOR_UI1 => Window border color, text completion menu (#7592EA)
# COLOR_UI2 => Window title color (#2BC4DE)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#787A94)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#5F617E)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#E0E2EA)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#65677D)
#
# COLOR_TEXT1 => Primary text color (#C0CAF5)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#98ABEF)
# COLOR_TEXT3 => Alternate text color (#BB9BF7)
# COLOR_TEXT4 => Alternate text color (#7BA2F7)
# COLOR_TEXT5 => Alternate text color (#C0CAF5)
#
# COLOR_PLUS => Extra user colors used for users: 
[theme.users]
colors = [
    "#787A94",
    "#5F617E",
    "#E0E2EA",
    "#65677D",
    "#98ABEF",
    "#BB9BF7",
    "#7BA2F7",
    "#C0CAF5",
    
]

[theme.default]
color = "#C0CAF5"
background = "#1A1B26"

[theme.completion]
default.background = "#303142"
default.color = "#7592EA"
selected.background = "#222330"
selected.color = "#C0CAF5"

[theme.timeline]
redacted.color = "#5F617E"

[theme.messages]
code.color = "#98ABEF"
code.background = "#222330"
emphasis.color = "#7BA2F7"
strong.color = "#BB9BF7"

[theme.rooms]
default.color = "#C0CAF5"
unread.color = "#98ABEF"
labels.color = "#7BA2F7"

[theme.windows]
border.color = "#7592EA"
title.color = "#2BC4DE"

[theme.encryption]
icon_encrypted.color = "#65677D"
icon_unencrypted.color = "#787A94"
icon_unknown.color = "#E0E2EA"

[theme.cmdbar]
error.color = "#787A94"
