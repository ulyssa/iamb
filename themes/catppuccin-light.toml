[theme.default]
color = "#4C4F69"
background = "#EFF1F5"

[theme.completion]
default.background = "#E6E9EF"
default.color = "#BCC0CC"
selected.background = "#E9EBF1"
selected.color = "#4C4F69"

[theme.timeline]
redacted.color = "#DD7878"

[theme.messages]
code.color = "#1E66F5"
code.background = "#E9EBF1"
emphasis.color = "#EA76CB"
strong.color = "#7287FD"

[theme.rooms]
default.color = "#04A5E5"
unread.color = "#1E66F5"
labels.color = "#EA76CB"

[theme.windows]
border.color = "#BCC0CC"
title.color = "#8839EF"

[theme.encryption]
icon_encrypted.color = "#40A02B"
icon_unencrypted.color = "#FE640B"
icon_unknown.color = "#7C7F93"

[theme.cmdbar]
error.color = "#FE640B"
