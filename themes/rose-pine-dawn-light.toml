# rose-pine-dawn-light theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#FAF4ED)
# COLOR_BG2 => Alternate background (#FFFAF3)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#575279)
#
# COLOR_UI1 => Window border color, completion menu background (#CECACD)
# COLOR_UI2 => Window title color (#286983)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#B4637A)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#EA9D34)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#797593)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#56949F)
#
# COLOR_TEXT1 => Primary text color (#575279)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#907AA9)
# COLOR_TEXT3 => Alternate text color (#9893A5)
# COLOR_TEXT4 => Alternate text color (#575279)
# COLOR_TEXT5 => Alternate text color (#575279)
#
#
[theme.users]
colors = [
    "#B4637A",
    "#EA9D34",
    "#797593",
    "#56949F",
    "#907AA9",
    "#9893A5",
    "#575279",
    "#575279",
]

[theme.default]
color = "#575279"
background = "#FAF4ED"

[theme.completion]
default.background = "#575279"
default.color = "#CECACD"
selected.background = "#FFFAF3"
selected.color = "#575279"

[theme.timeline]
redacted.color = "#EA9D34"

[theme.messages]
code.color = "#907AA9"
code.background = "#FFFAF3"
emphasis.color = "#575279"
strong.color = "#9893A5"

[theme.rooms]
default.color = "#575279"
labels.color = "#575279"
unread.name.color = "#907AA9"
unread.number.color = "#575279"
mention.number.color = "#B4637A"
notification.number.color = "#797593"
marked_unread.number.color = "#56949F"

[theme.windows]
border.color = "#CECACD"
title.color = "#286983"

[theme.encryption]
icon_encrypted.color = "#56949F"
icon_unencrypted.color = "#B4637A"
icon_unknown.color = "#797593"

[theme.cmdbar]
error.color = "#B4637A"
