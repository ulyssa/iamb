# rosebones-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#1A1825)
# COLOR_BG2 => Alternate background (#222030)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#E7DDDD)
#
# COLOR_UI1 => Window border color, completion menu background (#625D7F)
# COLOR_UI2 => Window title color (#BC9493)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#CAB0AF)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#317490)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#E1D4D4)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#69657E)
#
# COLOR_TEXT1 => Primary text color (#E0E2EA)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#9CCFD8)
# COLOR_TEXT3 => Alternate text color (#7D7997)
# COLOR_TEXT4 => Alternate text color (#E0E2EA)
# COLOR_TEXT5 => Alternate text color (#E0E2EA)
#
#
[theme.users]
colors = [
    "#CAB0AF",
    "#317490",
    "#E1D4D4",
    "#69657E",
    "#9CCFD8",
    "#7D7997",
    "#E0E2EA",
    "#E0E2EA",
]

[theme.default]
color = "#E0E2EA"
background = "#1A1825"

[theme.completion]
default.background = "#E7DDDD"
default.color = "#625D7F"
selected.background = "#222030"
selected.color = "#E0E2EA"

[theme.timeline]
redacted.color = "#317490"

[theme.messages]
code.color = "#9CCFD8"
code.background = "#222030"
emphasis.color = "#E0E2EA"
strong.color = "#7D7997"

[theme.rooms]
default.color = "#E0E2EA"
labels.color = "#E0E2EA"
unread.name.color = "#9CCFD8"
unread.number.color = "#E0E2EA"
mention.number.color = "#CAB0AF"
notification.number.color = "#E1D4D4"
marked_unread.number.color = "#69657E"

[theme.windows]
border.color = "#625D7F"
title.color = "#BC9493"

[theme.encryption]
icon_encrypted.color = "#69657E"
icon_unencrypted.color = "#CAB0AF"
icon_unknown.color = "#E1D4D4"

[theme.cmdbar]
error.color = "#CAB0AF"
