[theme.default]
color = "#F2CDCD"
background = "#181825"

[theme.completion]
default.background = "#2A2B3C"
default.color = "#89B4FA"
selected.background = "#1E1E2E"
selected.color = "#F2CDCD"

[theme.timeline]
redacted.color = "#45475A"

[theme.messages]
code.color = "#89DCEB"
code.background = "#1E1E2E"
emphasis.color = "#B4BEFE"
strong.color = "#F5C2E7"

[theme.rooms]
default.color = "#CBA6F7"
unread.color = "#89DCEB"
labels.color = "#B4BEFE"

[theme.windows]
border.color = "#89B4FA"
title.color = "#CDD6F4"

[theme.encryption]
icon_encrypted.color = "#A6E3A1"
icon_unencrypted.color = "#FAB387"
icon_unknown.color = "#9399B2"

[theme.cmdbar]
error.color = "#FAB387"
