# ayu-mirage-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#272D38)
# COLOR_BG2 => Alternate background (#242B38)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#0A0000)
#
# COLOR_UI1 => Window border color, completion menu background (#3BBBF4)
# COLOR_UI2 => Window title color (#FFCC66)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#F06B5C)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#FFAE57)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#FFC44C)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#BBE67E)
#
# COLOR_TEXT1 => Primary text color (#FFD57F)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#5CCFE6)
# COLOR_TEXT3 => Alternate text color (#80D4FF)
# COLOR_TEXT4 => Alternate text color (#D4BFFF)
# COLOR_TEXT5 => Alternate text color (#E0E2EA)
#
# COLOR_PLUS => Extra colors used for user names: #D9D7CE
[theme.users]
colors = [
    "#F06B5C",
    "#FFAE57",
    "#FFC44C",
    "#BBE67E",
    "#5CCFE6",
    "#80D4FF",
    "#D4BFFF",
    "#E0E2EA",
    "#D9D7CE",
]

[theme.default]
color = "#FFD57F"
background = "#272D38"

[theme.completion]
default.background = "#0A0000"
default.color = "#3BBBF4"
selected.background = "#242B38"
selected.color = "#FFD57F"

[theme.timeline]
redacted.color = "#FFAE57"

[theme.messages]
code.color = "#5CCFE6"
code.background = "#242B38"
emphasis.color = "#D4BFFF"
strong.color = "#80D4FF"

[theme.rooms]
default.color = "#E0E2EA"
labels.color = "#D4BFFF"
unread.name.color = "#5CCFE6"
unread.number.color = "#D4BFFF"
mention.number.color = "#F06B5C"
notification.number.color = "#FFC44C"
marked_unread.number.color = "#BBE67E"

[theme.windows]
border.color = "#3BBBF4"
title.color = "#FFCC66"

[theme.encryption]
icon_encrypted.color = "#BBE67E"
icon_unencrypted.color = "#F06B5C"
icon_unknown.color = "#FFC44C"

[theme.cmdbar]
error.color = "#F06B5C"
