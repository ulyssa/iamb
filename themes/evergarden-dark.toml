# evergarden-dark theme for iamb
#
# You can place this directly in your `~/.config/iamb/themes` directory to make it
# discoverable, or copy its contents directly into your `config.toml`.
#
# If you are looking to remix this file to make a derived theme, the colors were
# picked and assigned as:
#
# COLOR_BG1 => Primary background (#1C2225)
# COLOR_BG2 => Alternate background (#232A2E)
# COLOR_BG3 => Completion menu text, drawn reversed over COLOR_UI1 (#CBE3B3)
#
# COLOR_UI1 => Window border color, completion menu background (#4A585C)
# COLOR_UI2 => Window title color (#839E9A)
#
# COLOR_WARN1 => Errors, unencrypted, etc. - typically a red (#F57F82)
# COLOR_WARN2 => Redacted messages - typically a red or light orange (#DBE6AF)
# COLOR_WARN3 => Unknown encryption status - typically a yellow (#96B4AA)
#
# COLOR_GOOD1 => Encrypted indicator - typically a green (#6F8788)
#
# COLOR_TEXT1 => Primary text color (#F8F9E8)
# COLOR_TEXT2 => Contrast text color, should differ from COLOR_TEXT1 (#F3C0E5)
# COLOR_TEXT3 => Alternate text color (#B3E3CA)
# COLOR_TEXT4 => Alternate text color (#CBE3B3)
# COLOR_TEXT5 => Alternate text color (#F8F9E8)
#
#
[theme.users]
colors = [
    "#F57F82",
    "#DBE6AF",
    "#96B4AA",
    "#6F8788",
    "#F3C0E5",
    "#B3E3CA",
    "#CBE3B3",
    "#F8F9E8",
]

[theme.default]
color = "#F8F9E8"
background = "#1C2225"

[theme.completion]
default.background = "#CBE3B3"
default.color = "#4A585C"
selected.background = "#232A2E"
selected.color = "#F8F9E8"

[theme.timeline]
redacted.color = "#DBE6AF"

[theme.messages]
code.color = "#F3C0E5"
code.background = "#232A2E"
emphasis.color = "#CBE3B3"
strong.color = "#B3E3CA"

[theme.rooms]
default.color = "#F8F9E8"
labels.color = "#CBE3B3"
unread.name.color = "#F3C0E5"
unread.number.color = "#CBE3B3"
mention.number.color = "#F57F82"
notification.number.color = "#96B4AA"
marked_unread.number.color = "#6F8788"

[theme.windows]
border.color = "#4A585C"
title.color = "#839E9A"

[theme.encryption]
icon_encrypted.color = "#6F8788"
icon_unencrypted.color = "#F57F82"
icon_unknown.color = "#96B4AA"

[theme.cmdbar]
error.color = "#F57F82"
