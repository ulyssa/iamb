[package]
name = "iamb"
version = "0.0.12-alpha.2"
edition = "2024"
authors = ["Ulyssa <git@ulyssa.dev>"]
repository = "https://github.com/ulyssa/iamb"
homepage = "https://iamb.chat"
readme = "README.md"
description = "A Matrix chat client that uses Vim keybindings"
license = "Apache-2.0"
exclude = [".github", "CONTRIBUTING.md"]
keywords = ["matrix", "chat", "tui", "vim"]
categories = ["command-line-utilities"]
rust-version = "1.93"
build = "build.rs"

[features]
default = ["bundled", "desktop"]
bundled = ["matrix-sdk/bundled-sqlite"]
desktop = ["dep:notify-rust", "modalkit/clipboard"]
max_level_warn = ["tracing/max_level_warn"]
max_level_error = ["tracing/max_level_error"]
max_level_off = ["tracing/max_level_off"]
chafa-dyn = ["ratatui-image/chafa-dyn"]
chafa-static = ["ratatui-image/chafa-static"]

[build-dependencies.vergen-gitcl]
version = "9"
default-features = false
features = ["build"]

[dependencies]
anyhow = "1.0"
bitflags = "2.3"
chrono = "0.4"
clap = {version = "^4.6", features = ["derive"]}
clap_complete = "^4.6"
css-color-parser = "0.1.2"
dirs = "6.0"
edit = "0.1.4"
emojis = "0.8"
feruca = "0.11"
futures = "0.3"
gethostname = "1.1"
html5ever = "0.39.0"
http-serde = "2.1.1"
humansize = "2.0.0"
image = {version = "0.25.6", features = ["serde"], default-features = false}
libc = "0.2"
linkify = "0.11.0"
markup5ever_rcdom = "0.39"
mime = "0.3.16"
mime_guess = "2.0.4"
nom = "8.0"
open = "5.0.0"
rand = "0.10"
ratatui = "0.30.2"
regex = "1.5"
rpassword = "7.2"
serde = "1.0"
serde_json = "1.0"
shellexpand = "3.1"
sled = "0.34.7"
temp-dir = "0.2"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1.36"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
unicode-segmentation = "1.7"
unicode-width = "0.2"
url = {version = "2.2.2", features = ["serde"]}

[dependencies.comrak]
version = "0.52.0"
default-features = false
features = ["shortcodes"]

[dependencies.notify-rust]
version = "4.12"
optional = true

[dependencies.modalkit]
version = "0.0.26"
default-features = false
#git = "https://github.com/ulyssa/modalkit"
#rev = "ad12b9ba54dd1f022f54986931b5b1b358a6676d"

[dependencies.modalkit-ratatui]
version = "0.0.26"
#git = "https://github.com/ulyssa/modalkit"
#rev = "ad12b9ba54dd1f022f54986931b5b1b358a6676d"

[dependencies.matrix-sdk-base]
version = "0.18.0"

[dependencies.matrix-sdk]
version = "0.18.0"
default-features = false
features = ["e2e-encryption", "socks", "sqlite", "sso-login", "qrcode"]

[dependencies.matrix-sdk-crypto]
version = "0.18.0"

[dependencies.tokio]
version = "1.24.1"
features = ["macros", "net", "rt-multi-thread", "sync", "time"]

[dependencies.ratatui-image]
version = "11.0.6"
default-features = false
features = ["serde", "crossterm", "image-defaults"]

[dev-dependencies]
lazy_static = "1.4.0"
pretty_assertions = "1.4.0"

[profile.release-lto]
inherits = "release"
incremental = false
lto = true

[profile.release-light]
inherits = "release-lto"
opt-level = "z"
strip = true
panic = "abort"

[package.metadata.deb]
section = "net"
license-file = ["LICENSE", "0"]
assets = [
    # Binary:
    ["target/release/iamb", "usr/bin/iamb", "755"],
    # Manual pages:
    ["docs/iamb.1", "usr/share/man/man1/iamb.1", "644"],
    ["docs/iamb.5", "usr/share/man/man5/iamb.5", "644"],
    # Other assets:
    ["iamb.desktop", "usr/share/applications/iamb.desktop", "644"],
    ["config.example.toml", "usr/share/iamb/config.example.toml", "644"],
    ["docs/iamb.svg", "usr/share/icons/hicolor/scalable/apps/iamb.svg", "644"],
    ["docs/iamb.metainfo.xml", "usr/share/metainfo/iamb.metainfo.xml", "644"],
]

[package.metadata.generate-rpm]
version = "0.0.12_alpha.2"
assets = [
    # Binary:
    { source = "target/release/iamb", dest = "/usr/bin/iamb", mode = "755" },
    # Manual pages:
    { source = "docs/iamb.1", dest = "/usr/share/man/man1/iamb.1", mode = "644" },
    { source = "docs/iamb.5", dest = "/usr/share/man/man5/iamb.5", mode = "644" },
    # Other assets:
    { source = "iamb.desktop", dest = "/usr/share/applications/iamb.desktop", mode = "644" },
    { source = "config.example.toml", dest = "/usr/share/iamb/config.example.toml", mode = "644"},
    { source = "docs/iamb.svg", dest = "/usr/share/icons/hicolor/scalable/apps/iamb.svg", mode = "644"},
    { source = "docs/iamb.metainfo.xml", dest = "/usr/share/metainfo/iamb.metainfo.xml", mode = "644"},
]
